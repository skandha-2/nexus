apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}
  labels:
    app: {{ include "nexus.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "nexus.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "nexus.name" . }}
    spec:
      containers:
        - name: nexus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8081
              name: http
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{ else }}{{ include "nexus.fullname" . }}-pvc{{ end }}
