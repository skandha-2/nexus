apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: nexus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # --- BEGIN: set admin password at runtime from Secret ---
          env:
            - name: NEXUS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminPassword.existingSecret }}
                  key: {{ .Values.adminPassword.existingSecretKey }}
          command: ["/bin/sh","-c"]
          args:
            - >
              export INSTALL4J_ADD_VM_PARAMS="-Dnexus.security.randompassword=false
              -Dnexus.security.initialPassword=${NEXUS_ADMIN_PASSWORD}";
              exec /opt/sonatype/nexus/bin/nexus run
          # --- END ---
          ports:
            - containerPort: 8081
              name: http
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{ else }}{{ include "nexus.fullname" . }}-pvc{{ end }}
