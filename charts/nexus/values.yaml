replicaCount: 1

image:
  repository: sonatype/nexus3
  tag: "3.68.1"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8081

persistence:
  enabled: true
  storageClass: "local-storage"
  accessMode: ReadWriteOnce
  size: 20Gi
  existingClaim: ""

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

# IMPORTANT: your PVC (nexus-pvc) is currently bound and the pod is on node2.
# Either remove the pin or set it to node2 to avoid a scheduler mismatch.
nodeSelector: {}   # <- recommended: leave empty so the pod lands where the PV binds
# nodeSelector:
#   kubernetes.io/hostname: node2

tolerations: []    # remove control-plane toleration unless you really want to run on control-plane

affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nexus.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# --- NEW: how we supply the admin password securely
adminPassword:
  existingSecret: "admin"   # name of the secret you will create
  existingSecretKey: "password"   # key inside that secret
