replicaCount: 1

image:
  repository: sonatype/nexus3
  tag: "3.68.1"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8081

persistence:
  enabled: true
  storageClass: "local-storage"
  accessMode: ReadWriteOnce
  size: 20Gi
  existingClaim: ""

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

nodeSelector:
  kubernetes.io/hostname: node1   # <-- the node where the local path exists

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nexus.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
