replicaCount: 1

image:
  repository: sonatype/nexus3
  tag: "3.92.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podAnnotations: {}
podLabels: {}

securityContext:
  enabled: true
  fsGroup: 200

containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 200
  runAsGroup: 200
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8081
  dockerPort:
    enabled: false
    port: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nexus.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: nexus-tls
  #   hosts:
  #     - nexus.example.com

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  storageClassName: ""   # set to your storageclass or leave empty for default
  annotations: {}

env:
  - name: INSTALL4J_ADD_VM_PARAMS
    value: "-Xms1024m -Xmx2048m -XX:MaxDirectMemorySize=2048m"

livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 120
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
