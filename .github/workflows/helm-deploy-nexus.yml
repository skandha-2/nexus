name: Reusable • Helm Deploy (Nexus)

on:
  workflow_call:
    inputs:
      chart_dir:
        description: "Path to the Nexus Helm chart (folder with Chart.yaml)"
        required: true
        type: string
      release_name:
        description: "Helm release name"
        default: "nexus"
        type: string
      namespace:
        description: "Kubernetes namespace to deploy into"
        default: "nexus"
        type: string
      values_file:
        description: "Optional relative path to values.yaml overrides"
        default: ""
        type: string
      set_values:
        description: "Optional extra --set key=val,key2=val2"
        default: ""
        type: string
      wait_for_rollout:
        description: "Wait for rollout to complete (true/false)"
        default: "true"
        type: string
      print_logs:
        description: "Print recent pod logs after deploy (true/false)"
        default: "true"
        type: string
      log_label_selector:
        description: "Label selector for the Nexus pod to log"
        default: "app=nexus"
        type: string
      log_tail_lines:
        description: "How many log lines to print"
        default: "200"
        type: string
    secrets:
      KUBE_CONFIG:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  helm_deploy:
    name: Helm Upgrade/Install
    runs-on: self-hosted
    env:
      CHART_DIR: ${{ inputs.chart_dir }}
      RELEASE_NAME: ${{ inputs.release_name }}
      RELEASE_NAMESPACE: ${{ inputs.namespace }}
      VALUES_FILE: ${{ inputs.values_file }}
      SET_VALUES: ${{ inputs.set_values }}
      WAIT_FOR_ROLLOUT: ${{ inputs.wait_for_rollout }}
      PRINT_LOGS: ${{ inputs.print_logs }}
      LOG_SELECTOR: ${{ inputs.log_label_selector }}
      LOG_TAIL: ${{ inputs.log_tail_lines }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write kubeconfig from secret
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -e
          mkdir -p ~/.kube
          echo "${KUBECONFIG_B64}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.34.1"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.2"

      - name: Verify cluster access
        run: |
          echo "🔍 Checking cluster version and nodes..."
          kubectl version --client || kubectl version
          kubectl get nodes -o wide
      
      - name: Create namespace (idempotent)
        shell: bash
        run: |
          kubectl get ns "$RELEASE_NAMESPACE" >/dev/null 2>&1 || kubectl create ns "$RELEASE_NAMESPACE"

      - name: Helm dependency build (if needed)
        shell: bash
        run: |
          if [ -f "$CHART_DIR/Chart.yaml" ] && grep -q 'dependencies:' "$CHART_DIR/Chart.yaml"; then
            helm dependency build "$CHART_DIR"
          fi

      - name: Helm upgrade/install Nexus
        shell: bash
        run: |
          set -euo pipefail

          VALUES_ARG=()
          if [ -n "$VALUES_FILE" ] && [ -f "$VALUES_FILE" ]; then
            echo "➡ Using values file: $VALUES_FILE"
            VALUES_ARG+=( -f "$VALUES_FILE" )
          fi

          SET_ARG=()
          if [ -n "$SET_VALUES" ]; then
            echo "➡ Using --set: $SET_VALUES"
            SET_ARG+=( --set "$SET_VALUES" )
          fi

          helm upgrade --install "$RELEASE_NAME" "$CHART_DIR" \
            --namespace "$RELEASE_NAMESPACE" \
            "${VALUES_ARG[@]}" \
            "${SET_ARG[@]}" \
            --history-max 10

      - name: Wait for rollout (optional)
        if: ${{ inputs.wait_for_rollout == 'true' }}
        shell: bash
        run: |
          echo "⏳ Waiting for deployment rollout..."
          # Try common resource kinds; ignore errors if some don't exist
          kubectl -n "$RELEASE_NAMESPACE" rollout status deploy/"$RELEASE_NAME" --timeout=5m || true
          # If your chart labels Pods with app=<release_name>, this helps double-check readiness:
          kubectl -n "$RELEASE_NAMESPACE" get pods -l "app=${RELEASE_NAME}" -o wide || true

      - name: Show Service info
        shell: bash
        run: |
          echo "📡 Services in namespace $RELEASE_NAMESPACE"
          kubectl -n "$RELEASE_NAMESPACE" get svc -o wide || true
          echo
          echo "🔎 Trying to detect external Nexus URL (if LoadBalancer):"
          SVC_IP=$(kubectl -n "$RELEASE_NAMESPACE" get svc "$RELEASE_NAME" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          SVC_HOST=$(kubectl -n "$RELEASE_NAMESPACE" get svc "$RELEASE_NAME" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          NODE_PORT=$(kubectl -n "$RELEASE_NAMESPACE" get svc "$RELEASE_NAME" -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || true)
          PORT=$(kubectl -n "$RELEASE_NAMESPACE" get svc "$RELEASE_NAME" -o jsonpath='{.spec.ports[0].port}' 2>/dev/null || echo "8081")
          if [ -n "$SVC_IP" ]; then
            echo "➡ http://${SVC_IP}:${PORT}"
          elif [ -n "$SVC_HOST" ]; then
            echo "➡ http://${SVC_HOST}:${PORT}"
          elif [ -n "$NODE_PORT" ]; then
            echo "➡ NodePort detected: ${NODE_PORT} (port ${PORT})"
          else
            echo "➡ No external address detected yet (ClusterIP or pending)."
          fi

      - name: Print recent pod logs (optional)
        if: ${{ inputs.print_logs == 'true' }}
        shell: bash
        run: |
          echo "🪵 Printing last ${LOG_TAIL} lines from a pod matching: ${LOG_SELECTOR}"
          POD=$(kubectl -n "$RELEASE_NAMESPACE" get pods -l "$LOG_SELECTOR" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -z "$POD" ]; then
            echo "⚠️ No pod matched selector: $LOG_SELECTOR"
            exit 0
          fi
          echo "📜 Pod: $POD"
          kubectl -n "$RELEASE_NAMESPACE" logs --tail="$LOG_TAIL" "$POD" || true
