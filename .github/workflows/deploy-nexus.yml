name: Publish Nexus Helm Chart (OCI)

on:
  push:
    branches: 
      - dev
    paths:
      - "charts/nexus/**"
      - ".github/workflows/publish-helm-oci.yml"
jobs:
  publish:
    runs-on: arc-runners-dev
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm lint
        run: helm lint charts/nexus

      - name: Login to GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/nexus --destination dist

      - name: Push chart to GHCR (OCI)
        run: |
          CHART_TGZ="$(ls -1 dist/*.tgz | head -n 1)"
          helm push "$CHART_TGZ" oci://ghcr.io/${{ github.repository_owner }}/helm
