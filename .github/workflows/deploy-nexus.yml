name: Deploy Nexus (Helm)

on:
  workflow_dispatch:
    inputs:
      values_file:
        description: "Values override file (optional)"
        default: ""
        type: string
      set_values:
        description: "Extra --set key=val pairs (optional)"
        default: ""
        type: string
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    uses: skandha-2/re-usable-workflows/.github/workflows/helm-deploy-nexus.yml@main
    with:
      chart_dir: charts/nexus
      release_name: nexus
      namespace: nexus
      values_file: ${{ inputs.values_file }}
      set_values: ${{ inputs.set_values }}
      wait_for_rollout: "true"
      print_logs: "true"
      log_label_selector: "app=nexus"
      log_tail_lines: "200"
    secrets:
      # Prefer base64 kubeconfig
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      # Or pass raw kubeconfig instead:
      # KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      # If you later enable custom admin password via Secret in the chart:
      # NEXUS_ADMIN_PASSWORD: ${{ secrets.NEXUS_ADMIN_PASSWORD }}
